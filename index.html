<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.9) 0 1px,transparent 2px),radial-gradient(circle at 80% 30%,rgba(255,255,255,.7) 0 1px,transparent 2px),linear-gradient(135deg,#fff8fc,#f9eaf5 45%,#eee7f7);color:#4a3b46;position:relative}body:before,body:after{content:"♡  ✦  ♡  ✧  ♡";position:absolute;color:rgba(198,117,160,.22);font-size:28px;letter-spacing:22px;animation:drift 8s ease-in-out infinite alternate;pointer-events:none}body:before{top:10%;left:-20px}body:after{bottom:10%;right:-35px;animation-delay:-3s}.card{width:min(90%,390px);padding:38px 28px 32px;text-align:center;position:relative;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 22px 60px rgba(121,82,108,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:appear .9s cubic-bezier(.2,.8,.2,1)}.card:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,130,169,.18);border-radius:23px;pointer-events:none}.sparkle{font-size:20px;color:#c77da5;margin-bottom:8px;animation:twinkle 1.8s ease-in-out infinite}.emoji{font-size:58px;margin-bottom:16px;filter:drop-shadow(0 7px 10px rgba(183,112,151,.18));animation:float 2.2s ease-in-out infinite}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,7vw,31px);line-height:1.2;color:#76556a;margin-bottom:14px;font-weight:700}h1 span{color:#bd7199;font-style:italic}p{font-size:15.5px;color:#7c6875;line-height:1.65;margin:0 auto 24px;max-width:300px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;min-width:210px;background:linear-gradient(135deg,#d58aad,#b96f99);color:white;text-decoration:none;border-radius:999px;font-size:15px;font-weight:bold;letter-spacing:.2px;box-shadow:0 10px 25px rgba(185,111,153,.25);transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}.button:after{content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .55s ease}.button:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px rgba(185,111,153,.32)}.button:hover:after{left:125%}.button:active{transform:scale(.97)}.tiny-note{margin-top:17px;margin-bottom:0;font-size:11px;color:#ae91a2;letter-spacing:1px}@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes drift{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-16px) rotate(2deg)}}
</style>
</head><body><div class="card"><div class="sparkle">✦　♡　✦</div><div class="emoji">🎁</div><h1>Hi <span>LIA</span>!!<br>I Made Something For You</h1><p>There's a little surprise waiting for you.<br>Take your time... and open it when you're ready. ♡</p><a href="birthday.html" class="button">Open Your Surprise <span>♡</span></a><p class="tiny-note">made with a little extra love ✧</p></div></body></html>
