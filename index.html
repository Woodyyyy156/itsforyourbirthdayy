<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 380px;
      padding: 40px 25px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);

      animation: appear 0.8s ease;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #e91e63;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;

      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
      background: #c2185b;
    }

    .button:active {
      transform: scale(0.95);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="emoji">🎁</div>

    <h1>Hi LIA!! <br> I Made Something For You</h1>

    <p>
      There's a little surprise waiting for you.
      Click the button when you're ready. 👀
    </p>

    <a href="birthday.html" class="button">
      Open Your Surprise 💗
    </a>

  </div>

</body>
</html>
